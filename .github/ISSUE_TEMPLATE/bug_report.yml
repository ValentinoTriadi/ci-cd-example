name: Bug report
description: Something behaves differently than documented.
labels: [bug, triage]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include the exact error output if there is one.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. make docker
        2. docker run ...
        3. curl ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `curl localhost:8080/version`, or the image tag.
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Where did this happen?
      options: [local, development, staging, production, CI]
    validations:
      required: true
