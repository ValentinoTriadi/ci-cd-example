name: Feature request
description: Suggest a change to the app or the pipeline.
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation, not the solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [application, CI workflows, CD / deployment, release process, docs]
    validations:
      required: true
