# Build (and optionally publish) the container image to GitHub Container Registry.
#
# Publishing uses the automatic GITHUB_TOKEN — there is no registry secret to
# configure. PR runs call this with push:false, so a broken Dockerfile still
# fails the PR without polluting the registry.
name: Reusable · Docker

on:
  workflow_call:
    inputs:
      tags:
        description: Newline-separated docker/metadata-action tag rules.
        type: string
        required: true
      push:
        description: Push to GHCR. False builds only (used on pull requests).
        type: boolean
        default: false
      platforms:
        description: Comma-separated build platforms.
        type: string
        default: linux/amd64,linux/arm64
      version:
        description: Version string to stamp into the binary.
        type: string
        required: true
      commit:
        description: Short commit SHA to stamp into the binary.
        type: string
        required: true
    outputs:
      image:
        description: Fully qualified image reference, pinned to the digest.
        value: ${{ jobs.build.outputs.image }}
      digest:
        description: The image digest that was built.
        value: ${{ jobs.build.outputs.digest }}

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GHCR
      security-events: write # upload the Trivy SARIF report
    outputs:
      image: ${{ steps.reference.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      # Buildx cannot load a multi-platform image into the local daemon, and
      # build-only runs have nowhere else to put it. Fail loudly rather than
      # producing an image nothing can smoke-test.
      - name: Validate inputs
        if: ${{ !inputs.push && contains(inputs.platforms, ',') }}
        run: |
          echo "::error::push=false requires a single platform, got '${{ inputs.platforms }}'"
          exit 1

      - name: Record the build timestamp
        id: now
        run: echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >>"$GITHUB_OUTPUT"

      # QEMU only matters for the non-native platform legs.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: inputs.push
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and OCI labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: ${{ inputs.tags }}
          labels: |
            org.opencontainers.image.title=ci-cd-example
            org.opencontainers.image.description=Reference GitHub Actions CI/CD pipeline
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.push }}
          load: ${{ !inputs.push }} # keep the image locally so we can smoke-test it
          # (validated above: push=false implies exactly one platform)
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ inputs.version }}
            COMMIT=${{ inputs.commit }}
            BUILD_DATE=${{ steps.now.outputs.date }}
          provenance: ${{ inputs.push }}
          sbom: ${{ inputs.push }}
          # Reuse layers across runs; type=gha is scoped to the repository.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Deploys should reference an immutable digest, never a tag someone can
      # move underneath them.
      - name: Compose the digest-pinned reference
        id: reference
        run: |
          if [[ "${{ inputs.push }}" == "true" ]]; then
            image="${REGISTRY}/${IMAGE_NAME}@${{ steps.build.outputs.digest }}"
          else
            # Nothing was pushed, so report the first local tag instead.
            image="$(head -n1 <<<'${{ steps.meta.outputs.tags }}')"
          fi
          image="$(tr '[:upper:]' '[:lower:]' <<<"$image")"

          echo "image=${image}" >>"$GITHUB_OUTPUT"
          echo "### 📦 Image" >>"$GITHUB_STEP_SUMMARY"
          echo "\`${image}\`" >>"$GITHUB_STEP_SUMMARY"

      # Run the image we just built and hit it with the same smoke test the
      # deploy jobs use. Only possible on the native platform.
      - name: Smoke-test the built image
        if: contains(inputs.platforms, 'linux/amd64')
        run: |
          image="$(head -n1 <<<'${{ steps.meta.outputs.tags }}')"
          if [[ "${{ inputs.push }}" == "true" ]]; then
            docker pull --platform linux/amd64 "$image"
          fi

          docker run -d --name smoke -p 8080:8080 --platform linux/amd64 "$image"
          trap 'docker logs smoke || true; docker rm -f smoke || true' EXIT

          ./scripts/smoke-test.sh http://127.0.0.1:8080

      - name: Scan the image for vulnerabilities
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: ${{ steps.reference.outputs.image }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          # Report, do not block: a base-image CVE should not wedge every deploy.
          exit-code: "0"

      - name: Upload the scan report to code scanning
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image
